<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

            data-website-id="d51adeca-99c1-423f-aa3f-ed0270225bcf"
            data-domains="chrisalorenzo.com"
            data-do-not-track="true"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231c1e22'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='28' fill='%23f4f4f2' text-anchor='middle'%3ECL%3C/text%3E%3C/svg%3E" />
    <!-- OG social preview: production serves v17-og.png at https://chrisalorenzo.com/og.png -->
    <meta property="og:title" content="Christopher Lorenzo" />
    <meta property="og:description" content="I study systems by building them. Homelab, automation, and the road to platform engineering." />
    <meta property="og:type" content="website" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Christopher Lorenzo" />
    <meta name="twitter:description" content="I study systems by building them. Homelab, automation, and the road to platform engineering." />
    <meta name="twitter:image" content="https://chrisalorenzo.com/og.png" />
    <script>
      /* Apply the stored theme and motion before first paint.
         Theme is light or dark. A blog id ending in -light or -dark
         maps onto that pair and is not written back. Motion is full
         or reduced. The OS preference is the fallback for either. */
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || (t && t.slice(-6) === '-light')) t = 'light';
        else if (t === 'dark' || (t && t.slice(-5) === '-dark')) t = 'dark';
        else t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var m = localStorage.getItem('motion');
        if (m !== 'full' && m !== 'reduced') {
          m = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full';
        }
        document.documentElement.setAttribute('data-motion', m);
      } catch (e) {}
    </script>
  <style>
    /* Layer 6 loading splash: visible before React hydrates, removed on mount. */
    #splash{position:fixed;inset:0;z-index:1000;background:#141518;display:flex;align-items:center;justify-content:center;gap:14px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.14em;color:#9a9da3}
    #splash .splash-mark{width:36px;height:36px;border:1px solid #2e3138;border-radius:8px;display:flex;align-items:center;justify-content:center;
      color:#f4f4f2;font-size:14px;font-weight:700;letter-spacing:.02em}
    #splash .splash-word{animation:splash-pulse 1.6s ease-in-out infinite}
    @keyframes splash-pulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){#splash .splash-word{animation:none}}
  </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading portfolio">
      <span class="splash-mark" aria-hidden="true">CL</span>
      <span class="splash-word">INITIALIZING PORTFOLIO</span>
    </div>
    <noscript><style>#splash{display:none}</style></noscript>
    <div id="root"></div>
    <script>
      /* Layer 6 failsafe: never let the splash trap the page if the app bundle fails to load. */
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s && !window.__portfolioBooted) s.parentNode.removeChild(s);
      }, 8000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
